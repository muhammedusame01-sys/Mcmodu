ame: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        env:
          MODDATA: 
        run: echo "$MODDATA" | base64 -d | tar xz && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-alert-jar
          path: build/libs/proximity-alert-1.0.0.jar
          
